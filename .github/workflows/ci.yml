name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Lint · Type-check · Testes · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O gate só entrou depois que as cinco vulnerabilidades altas herdadas do
      # Next foram corrigidas: gate que nasce vermelho ninguém lê, todo mundo
      # aprende a ignorar. A partir daqui, dependência vulnerável barra a PR.
      #
      # Efeito colateral aceito: um aviso publicado hoje pode reprovar uma PR que
      # não encostou em dependência nenhuma. É o preço de saber no dia, e não no
      # dia do incidente.
      - name: Dependência vulnerável
        run: npm audit --audit-level=high

      - name: ESLint (eslint-config-next + aderência ao DS)
        run: npm run lint

      - name: Lint de aderência (oxlint)
        run: npm run lint:ds

      # Os tipos são gerados do contrato e commitados. Dessincronizados, o build
      # passaria com um tipo que envelheceu em silêncio — que é justamente o que
      # gerar do contrato evita. O contrato em si é conferido no CI do back-end.
      - name: Tipos em dia com o contrato
        run: |
          npm run tipos
          git diff --exit-code lib/api/gerado/ \
            || { echo "::error::Tipos dessincronizados. Rode 'npm run contrato:sync && npm run tipos' e commite."; exit 1; }

      - name: Type-check (tsc --noEmit, strict)
        run: npm run typecheck

      # O gate de cobertura é uma catraca: os limiares em vitest.config.mts são a
      # medição do dia, não uma meta. Sobem a cada bloco da ordem de implementação
      # e nunca descem — remover teste reprova aqui.
      - name: Testes e gate de cobertura
        run: npm run coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Build de produção
        run: npm run build

      # O app é static export servido pelo GitHub Pages. Sem 404.html, recarregar
      # qualquer rota que não seja a raiz devolve erro — e isso só apareceria em
      # produção, depois do deploy.
      - name: Export estático íntegro
        run: |
          test -f out/index.html || { echo "::error::out/index.html ausente"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html ausente — rota recarregada devolveria 404"; exit 1; }

  e2e:
    name: Jornada e acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A versão do Playwright é fixada no package.json; o navegador que ele
      # baixa aqui é o mesmo revisão que roda nas máquinas de desenvolvimento.
      # Navegador que se atualiza sozinho transforma verde em vermelho de
      # madrugada, sem ninguém ter mudado nada.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # A API é interceptada em e2e/api.ts — nunca a real: o e2e não pode
      # depender de backend no ar nem tocar em dado de gente de verdade.
      - name: Jornada de ponta a ponta
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  scan-de-segredos:
    name: Scan de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: o gitleaks varre todo o histórico, não só o último commit.
      # Segredo removido num commit posterior continua no histórico e continua vazado.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          VERSAO=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detectar segredos versionados
        run: gitleaks detect --source . --redact --verbose --no-banner
