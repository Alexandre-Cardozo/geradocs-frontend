name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          
      # Sem `static_site_generator: next`: com ele, a action não reconhece o
      # next.config.ts, cria um next.config.js em branco com output/basePath/
      # images, e o Next lê esse no lugar do nosso. Toda a config do repositório
      # era ignorada em produção — o `trailingSlash` do login no celular
      # (08/10/2026) passou no CI e não chegou ao Pages. O next.config.ts já
      # declara tudo o que a action injetava; o prefixo vem do env abaixo.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        
      - name: Build with Next.js
        env:
          # O prefixo vem do próprio Pages (§128): `/geradocs-frontend` enquanto
          # o site é servido em alexandre-cardozo.github.io, e vazio quando o
          # domínio próprio (govpro.com.br) está configurado nas Settings do
          # repositório. Assim ativar o domínio não pede mudança de código: basta
          # publicar de novo. Fixá-lo no next.config.ts o fazia valer também em
          # desenvolvimento, onde ele só sujava a URL de quem desenvolve.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          HOST_DO_PAGES: ${{ steps.pages.outputs.host }}
          # Repository variable configured in GitHub, never hardcode a local API.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          echo "Publicação em ${HOST_DO_PAGES}, prefixo '${NEXT_PUBLIC_BASE_PATH}'"
          # Em github.io o site vive sob o nome do repositório: prefixo vazio ali
          # quebraria todos os arquivos estáticos.
          if [[ "$HOST_DO_PAGES" == *github.io && -z "$NEXT_PUBLIC_BASE_PATH" ]]; then
            echo "::error::Pages em ${HOST_DO_PAGES} sem prefixo: o configure-pages não informou o base_path"
            exit 1
          fi
          npm run build

      # `login/index.html` só existe com o `trailingSlash` do next.config.ts. Se
      # faltar, o build leu outra config — e o login no celular volta a quebrar.
      - name: Config do repositório aplicada
        run: |
          test -f out/login/index.html || { echo "::error::out/login/index.html ausente — o build ignorou o next.config.ts"; exit 1; }
          test -f out/index.txt        || { echo "::error::out/index.txt ausente"; exit 1; }
          test -f out/404.html         || { echo "::error::out/404.html ausente"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
