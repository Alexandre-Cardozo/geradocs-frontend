<!-- @dsCard group="Brand" viewport="820x300" name="Logos" subtitle="Marca aprovada (A · Faceta): mark = símbolo · logo = símbolo + nome · endosso · -white para fundo escuro" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--font-body)}
.box{border:1px solid var(--color-border-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px}
.dark{background:#071A3D;border:none}.wide{grid-column:span 2}
.cap{font-size:10px;color:var(--color-text-muted);font-family:var(--font-mono)}.dark .cap{color:rgba(255,255,255,0.45)}</style></head>
<body>
<div class="box"><img src="../assets/geradocs-mark.svg" alt="GeraDocs" style="height:56px"><div class="cap">geradocs-mark</div></div>
<div class="box"><img src="../assets/govpro-mark.svg" alt="GovPro" style="height:56px"><div class="cap">govpro-mark</div></div>
<div class="box dark"><img src="../assets/geradocs-mark-white.svg" alt="GeraDocs" style="height:56px"><div class="cap">geradocs-mark-white</div></div>
<div class="box dark"><img src="../assets/govpro-mark-white.svg" alt="GovPro" style="height:56px"><div class="cap">govpro-mark-white</div></div>
<div class="box wide"><img src="../assets/geradocs-logo.svg" alt="GeraDocs" style="height:40px"><div class="cap">geradocs-logo</div></div>
<div class="box wide"><img src="../assets/govpro-logo.svg" alt="GovPro" style="height:40px"><div class="cap">govpro-logo</div></div>
<div class="box wide"><img src="../assets/geradocs-endosso-govpro.svg" alt="GeraDocs, uma solução GovPro" style="height:36px"><div class="cap">geradocs-endosso-govpro</div></div>
<div class="box wide dark"><img src="../assets/geradocs-logo-white.svg" alt="GeraDocs" style="height:32px"><div style="font-size:10px;color:rgba(255,255,255,0.4);font-weight:500;letter-spacing:0.5px;text-transform:uppercase">Uma solução GovPro</div><div class="cap">sidebar (geradocs-logo-white)</div></div>
</body></html>
